<style>
:root { --dorado: #c5a059; --oscuro: #1a1a1a; --crema: #f9f7f2; }
*, *::before, *::after { box-sizing: border-box; }
body { font-family: 'Montserrat', sans-serif; margin: 0; background-color: var(--crema); color: var(--oscuro); overflow-x: hidden; }

header {
  height: 65vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://i.ibb.co/5Wmn0H7v/0d8651292fd255127875f2fd8471f754.jpg');
  background-size: cover; background-position: center; color: white; text-align: center;
}
h1 { font-family: 'Cinzel', serif; font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: 12px; margin: 0; }
.linea-decor { width: 80px; height: 1.5px; background: var(--dorado); margin: 25px auto; }
.slogan-principal { letter-spacing: 8px; font-weight: 300; text-transform: uppercase; font-size: 0.85rem; max-width: 80%; }

.seccion-encabezado { text-align: center; padding: 80px 10% 30px; }
.seccion-titulo { font-family: 'Cinzel', serif; letter-spacing: 6px; color: var(--dorado); font-size: 2rem; margin-bottom: 12px; text-transform: uppercase; }
.uso-sugerido { font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: #999; font-weight: 500; font-style: italic; }

.catalogo { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; padding: 0 8% 80px; }
.producto { background: white; padding: 30px; border: 1px solid #f0f0f0; text-align: center; transition: 0.5s; }
.producto:hover { transform: translateY(-12px); box-shadow: 0 15px 40px rgba(0,0,0,0.06); border-color: var(--dorado); }

.img-box { width: 100%; height: 350px; overflow: hidden; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; }
.img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

.info h3 { font-family: 'Cinzel', serif; margin: 15px 0 5px; font-size: 1.3rem; letter-spacing: 2px; }
.tag-premium { font-size: 0.65rem; color: var(--dorado); font-weight: bold; text-transform: uppercase; letter-spacing: 2.5px; display: block; margin-bottom: 18px; }
.peso-tag { font-size: 0.65rem; color: #999; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 6px; }
.beneficio { font-size: 0.85rem; color: #777; font-style: italic; min-height: 90px; line-height: 1.7; margin-bottom: 25px; }
.ingredientes-tag { font-size: 0.7rem; color: var(--dorado); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #f5f5f5; padding-bottom: 12px; margin-bottom: 18px; display: block; }

/* === OPTIMIZACIÓN 4: Precio final con mayor peso visual === */
.precio-final {
    color: #D4AF37;
    font-weight: 800;
    font-size: 1.45em;
    margin: 10px 0;
    letter-spacing: 0.5px;
}

.btn-reserva { display: inline-block; padding: 14px 35px; background: var(--oscuro); text-decoration: none; color: white; font-size: 0.75rem; letter-spacing: 3px; transition: 0.4s; border: 1.5px solid var(--oscuro); }
.btn-reserva:hover { background: transparent; color: var(--oscuro); }

.comparativa { background: #fff; padding: 100px 10%; border-top: 1px solid #eee; }
.grid-comparativa { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 60px; }
.comparativa-box h4 { font-family: 'Cinzel', serif; color: var(--dorado); margin-bottom: 30px; font-size: 1.4rem; letter-spacing: 3px; }

.proximamente { background: #efebe3; padding: 80px 10%; text-align: center; border-top: 1px solid #e0ddd5; }
.proximamente h2 { font-family: 'Cinzel', serif; font-size: 1.8rem; letter-spacing: 6px; margin-bottom: 20px; }
.proximamente p { font-size: 0.9rem; color: #666; letter-spacing: 1.5px; line-height: 2; }

footer { background: var(--oscuro); color: #888; padding: 80px 10% 40px; text-align: center; }
.footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 50px; margin-bottom: 50px; }
.footer-section h4 { color: var(--dorado); font-family: 'Cinzel', serif; margin-bottom: 25px; letter-spacing: 4px; }
.footer-social { margin-top: 18px; }

.footer-social a:hover { color: var(--dorado); border-color: var(--dorado); }
.copyright { border-top: 1px solid #2a2a2a; padding-top: 40px; font-size: 0.7rem; letter-spacing: 2px; }

.whatsapp-btn { position: fixed; bottom: 40px; right: 40px; background: var(--oscuro); color: var(--dorado); padding: 18px 30px; text-decoration: none; font-weight: bold; font-size: 0.75rem; letter-spacing: 3px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); transition: 0.5s; z-index: 1000; border: 1.5px solid var(--dorado); text-transform: uppercase; }

.pack-precios {

}
.pack-precio-tachado {

}
.pack-precio-final--dorado {

}
.pack-consulta {

.pack-consulta p {

/* === Sé de los Primeros (NUEVA SECCIÓN) === */
.primeros-section {
    background: #fdf2e9;

/* === Rituales Complementarios === */
.rituales-complementarios {
    background-color: #ffffff;
    padding: 40px 10px;
    font-family: 'Georgia', serif;
}
.rituales-complementarios-titulo {
    text-align: center;
    color: #d4af37;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 10px;
    font-size: 1.4rem;
}
.rituales-complementarios-subtitulo {
    text-align: center;
    color: #888;
    font-size: 0.8rem;
    font-style: italic;
    margin-bottom: 35px;
}
.rituales-complementarios-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 25px;
    max-width: 1100px;
    margin: 0 auto;
}
.card-ritual {
    position: relative;
    overflow: hidden;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}
.card-ritual img {
    width: 100%;
    display: block;
    transition: transform 0.6s ease;
}
.card-ritual:hover img { transform: scale(1.1); }
.card-ritual .overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.96);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: opacity 0.5s;
    padding: 20px;
    text-align: center;
    box-sizing: border-box;
}
.card-ritual:hover .overlay,
.card-ritual:active .overlay { opacity: 1; }
.overlay h4 {
    color: #d4af37;
    margin-bottom: 8px;
    font-size: 1rem;
    letter-spacing: 1px;
}
.overlay p {
    font-size: 0.82rem;
    color: #444;
    line-height: 1.6;
}

}
.mascarilla-opcion-pack h5 {

}

.consulta-gratis-box {

.consulta-gratis-texto {

.btn-pack-personalizado {

/* === Crema Hidratante === */
.crema-section {

/* === FAQ (NUEVA SECCIÓN) === */
.faq-section {
    background: #fff;
    padding: 90px 10%;
    border-top: 1px solid #eee;
    text-align: center;
}
.faq-list {
    max-width: 800px;
    margin: 45px auto 0;
    text-align: left;
}
.faq-item {
    border-bottom: 1px solid #eee;
    padding: 20px 0;
}
.faq-item summary {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    color: var(--oscuro);
    list-style: none;
    position: relative;
    padding-right: 35px;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::after {
    content: '+';
    position: absolute;
    right: 0;
    top: -2px;
    color: var(--dorado);
    font-size: 1.4rem;
    font-family: Arial, sans-serif;
}
.faq-item[open] summary::after { content: '\2212'; }
.faq-item p {
    color: #666;
    font-size: 0.9rem;
    line-height: 1.75;
    margin: 14px 0 0 0;
    font-family: 'Georgia', serif;
    font-style: italic;
}

/* === CARRITO DE COMPRAS (NUEVO) === */
.cart-controls { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.qty-selector { display: flex; align-items: center; border: 1px solid #ddd; position: relative; }
.qty-limit-toast { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--oscuro); color: var(--dorado); font-size: 0.62rem; letter-spacing: 0.5px; padding: 5px 10px; border-radius: 3px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.3s; margin-bottom: 8px; z-index: 5; }
.qty-limit-toast.mostrar { opacity: 1; }

.personaliza-block { text-align: left; margin: 18px 0; padding: 16px 18px; background: #faf7f0; border: 1px solid #eee; border-radius: 4px; }
.personaliza-block--compact { padding: 10px 12px; margin: 14px 0; }
.personaliza-block label { display: block; font-size: 0.68rem; letter-spacing: 1px; text-transform: uppercase; color: #999; margin: 12px 0 5px; font-family: 'Montserrat', sans-serif; }
.personaliza-block label:first-child { margin-top: 0; }
.personaliza-block select { width: 100%; padding: 9px 10px; border: 1px solid #ddd; font-family: 'Montserrat', sans-serif; font-size: 0.83rem; border-radius: 2px; background: #fff; color: var(--oscuro); }
.selector-jabon-grupo { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
.selector-jabon-grupo select { width: 100%; }
.selector-mascarilla-grupo { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
.selector-mascarilla-grupo select { width: 100%; }
.cart-item-detail { font-size: 0.72rem; color: var(--dorado); font-style: italic; margin: 2px 0 4px; line-height: 1.5; }
.qty-btn { background: #fff; border: none; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; color: var(--oscuro); }
.qty-btn:hover { background: #f5f5f5; }
